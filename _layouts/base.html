<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; }
    .container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 20px; }
    header, footer { background-color: #f4f4f4; padding: 20px 0; }
    nav ul { list-style: none; padding: 0; }
    nav ul li { display: inline; margin-right: 20px; }
    .content { min-height: 500px; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>{{ site.title }}</h1>
      <nav>
        <ul>
          <li><a href="{{ "/" | relative_url }}">Home</a></li>
          <li><a href="{{ "/pages/about" | relative_url }}">About</a></li>
          <li><a href="{{ "/pages/people" | relative_url }}">People</a></li>
          <li><a href="{{ "/pages/news" | relative_url }}">News</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="content">
    <div class="container">
      {{ content }}
    </div>
  </div>

  <footer>
    <div class="container">
      {% include shared/footer.md %}
    </div>
  </footer>

</body>
</html>
